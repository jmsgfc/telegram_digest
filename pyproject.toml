[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-personal-digest"
version = "0.1.0"
description = "个人 Telegram 群聊与频道增量 JSONL 导出工具"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.42,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
telegram-digest-web = "telegram_digest.web:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telegram_digest = ["web_static/*"]

